<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#EFF0EE;color:#13171A;
  font-family:"Golos Text",sans-serif;padding:64px 72px;position:relative;overflow:hidden}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:17px;letter-spacing:.13em;
  text-transform:uppercase;color:#964A00;margin-bottom:18px}
h1{font-family:Oswald,sans-serif;font-weight:600;font-size:76px;line-height:1.02;
  letter-spacing:-.015em;margin-bottom:20px;max-width:17ch}
p{font-size:25px;color:#5C6461;line-height:1.42;max-width:44ch}
.grid{position:absolute;left:72px;right:72px;bottom:64px;
  display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#C9D0CB;
  border:1px solid #C9D0CB}
.cell{background:#FBFCFB;padding:16px 18px}
.cell dt{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.09em;
  text-transform:uppercase;color:#5C6461;margin-bottom:6px}
.cell dd{font-family:Oswald,sans-serif;font-size:30px;font-weight:500;
  font-variant-numeric:tabular-nums;line-height:1}
.rule{position:absolute;left:0;top:0;width:8px;height:100%;background:#964A00}
</style></head><body>
<div class="rule"></div>
<div class="eyebrow">Разбор направления · 2 сентября 2026</div>
<h1>Стеллажи для пунктов выдачи</h1>
<p>Расчёт изделия по двум нормативам, себестоимость, каналы сбыта
и стратегия входа на рынок из 80 тысяч покупателей.</p>
<dl class="grid">
  <div class="cell"><dt>Старт</dt><dd>10.09.26</dd></div>
  <div class="cell"><dt>Пунктов</dt><dd>85 000</dd></div>
  <div class="cell"><dt>Рынок</dt><dd>0,93 млрд</dd></div>
  <div class="cell"><dt>Себестоим.</dt><dd>5 276 ₽</dd></div>
  <div class="cell"><dt>Клиент</dt><dd>7 792 ₽</dd></div>
</dl>
</body></html>
